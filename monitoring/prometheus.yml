global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # CI/CD server (Task 1): host metrics
  - job_name: cicd-server-node
    static_configs:
      - targets: ["APP_SERVER_IP:9100"]

  # CI/CD server (Task 1): Jenkins metrics (needs the Prometheus metrics plugin)
  - job_name: jenkins
    metrics_path: /prometheus
    static_configs:
      - targets: ["APP_SERVER_IP:8080"]
